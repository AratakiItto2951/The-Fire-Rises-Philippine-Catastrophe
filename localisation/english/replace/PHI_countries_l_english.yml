 dutertismo: "Dutertismo"
 dutertismo_authdem: "Dutertismo"
 dutertismo_authdem_desc: "\n\n\n\n£GFX_ideology_dutertismo\n\n\n\n\n\n§YDutertismo§! is the political movement embodying the illiberal vision of Rodrigo Duterte and his loyalists in the Philippines. Rooted in populist strongman rule, it blends authoritarian nationalism, anti-elite fervor, and pragmatic deal-making, rejecting liberal norms as barriers to progress.\n\nUnder Duterte’s iron hand, the Government of National Salvation champions the masses against Manila’s oligarchs and foreign meddlers, wielding a pro-China pivot to fuel economic growth while crushing dissent through martial resolve. Loyalty to the Duterte clan—forged in Mindanao’s heartland—defines its ranks, with patronage and propaganda rallying a fervent base. The drug war’s legacy and hardline governance cement its unyielding stance.\nIn the chaos of 2028, Dutertismo stands as a bulwark for the ‘true Filipino,’ promising order and prosperity amidst civil strife. Its acolytes, bound by the Duterte mystique, march to secure the nation’s salvation."
