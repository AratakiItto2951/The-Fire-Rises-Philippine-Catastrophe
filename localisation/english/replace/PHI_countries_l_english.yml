 #Frontend - Bookmark
 PHI_BOOKMARK_DESC: "With the rise of the firebrand populist strongman Rodrigo Duterte, the Philippines carves her own path free from the traditional alliance with America to flirt with the rising Chinese giant. But domestic unrest still shakes things up at home, with a loud, restive opposition questioning the excesses of the War on Drugs. \nReeling from the carnage of Marawi, darker clouds seem to be gathering on the horizon as Tokyo and Beijing begin locking horns at each other. Time, and maybe God, knows, if the ship could endure the coming relentless waters of the 2020s"
 
 #Play as faction tooltips
 PHI_PHL_path_tt: "§YProvisional Republic of the Philippines§!\n---------------\n\n\n\n\n£GFX_PHL_path_banner\n\n\n\n\n\n\n§gHonest Government, a Better Life for All\n\nFilipino, with hearts that would answer the call\nFilipino, with courage to rise when they fall\nFilipino, determined when they take a stand\nWho knows what's right and true\nI will be with you§!"
 PHI_miljunta_path_tt: "§YPhilippine Emergency Government§!\n---------------\n\n\n\n\n£GFX_PHI_miljunta_path_banner\n\n\n\n\n\n\n§gTo protect the people and secure the sovereignty of the state and the integrity of the national territory\n\nThe maintenance of peace and order, the protection of life, liberty, and property, and promotion of the general welfare are essential for the enjoyment by all the people of the blessings of democracy§!"
 PHI_PHP_path_tt: "§YGovernment of National Salvation§!\n---------------\n\n\n\n\n£GFX_PHP_path_banner\n\n\n\n\n\n\n§gChange has Come, through fearless solutions, fast action, courage, and compassion\n\nThe words have spread far and wide, The People have one wish\nShout to the skies, what we truly feel\nOur beloved Philippines, united once again!\nO Philippines, by Duterte we still stand firm!\nHe who truly loves us fully\nHis fight is also our fight§!"
 PHI_UPH_path_tt: "test"
 PHI_NPA_path_tt: "§YNew People's Army§!\n---------------\n\n\n\n\n£GFX_NPA_path_banner\n\n\n\n\n\n\n§gWorkers and Peasants, Unite!\n\nMarch forward my motherland, for we shall triumph\nFight for our rights, from the North, South, East and West\nIn every corner there is solidarity, the whole archipelago is the bridge\nUnited together, we shall never fall!§!"
 PHI_TAG_path_tt: "§YNational Revolutionary Army§!\n---------------\n\n\n\n\n£GFX_TAG_path_banner\n\n\n\n\n\n\n§gReclaim our Dignity, Stand Strong and Proud\n\nArise, ye Motherland\nChosen race in the Orient,\nLet us rescind the painful past,\nAnd embrace the new life.\n\nLong Live, Long Live, our Liberty, Liberty\nAnd let us promote Honor and Virtue.\n\nIn the spirit, we are all united,\nAnd we're going to face it, a great future!§!"