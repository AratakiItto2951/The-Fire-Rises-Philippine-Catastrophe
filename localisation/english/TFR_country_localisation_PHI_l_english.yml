 ##2ACW shitshow
 phi_2acw.1.t: "The Foul-Mouthed Address"
 phi_2acw.1.d: "“Putang inang ‘yan [that motherfu**er], this is how America is dying from within”, Duterte said on his speech, ranting about how he snubbed the foremost former colonizer and close ally, during his time in the high castle while on TV.\n“THE UNITED STATES IS ALREADY IN DECLINE FOR YEARS AND THAT’S HOW I WITNESS THE PHENOMENON WHEN WE DECIDE TO BECOME NEUTRAL BY ENDING VFA BUT UNFORTUNATELY, IT IS APPARENT THAT SOME MY KABABAYANS [FELLOW CITIZENS] HAVE WITNESSED THE DOWNFALL,” the Philippine Punisher have lamented on his fellow during the public ceremony, spewing out first his foul-mouthed words but then addressing the situation about America.\n\n“Our ally was already divided and there’s no way to save America. I am feeling sorry for most Filipinos who lived in America whose lives are already trapped by the war,” he delivered his another lamenting speech when he described the fraught situation among the Filipino-Americans.\n“God has punished and cursed some warmongers but they admonished others. There’s a real judgement already happening today when someone who has already gone through deep division has reached its point of no return”, another speech brought from his mouth by the controversial president when he describes exactly about recent Chinese moves on the disputed South China Sea/West Philippine Sea in the early weeks of Second Civil War.\n\nThe once erstwhile ally in the Pacific stands alone amidst the reports of rival rebel groups, extremists, law enforcement officers, gang members, and soldiers begin fighting on what remains of the desecrated Continental United States with recent fighting in Chicago or APLA’s making moves near San Francisco or Patriot Front pushing for “liberation” of Boston.\nONLY TIME WILL TELL WHEN AMERICA IS GONE, someone in Tokyo will fill up the vacuum left as Beijing is emboldened, ready to eye on the rebellious island of Taiwan in hopes to use military force on enforcing reunification nor politicians in Taipei or Canberra could have plan to stop the reunification dream from becoming reality."
 phi_2acw.1.a: "Caught in limbo between Tokyo and Beijing"
 phi_2acw.2.t: "The Appointed Son’s Proclamation"
 phi_2acw.2.d: "In the shadow of a crumbling world, Pastor Apollo Quiboloy, the self-proclaimed Appointed Son of God, stood before a sea of followers in Davao City, his voice thundering through the speakers of the Kingdom of Jesus Christ’s Prayer Mountain. It was mere weeks after former President Rodrigo Duterte’s scathing address, and the news of America’s descent into chaos had spread like wildfire. The once-mighty nation now lay in ruins—its cities burning, its people divided, its global influence shattered. Reports of the "Second Civil War" had escalated, with San Francisco reduced to a battleground between the APLA and Patriot Front militias, and Washington, D.C., a ghost town after a devastating rebel siege. China’s shadow loomed larger over Taiwan, while Tokyo scrambled to assert itself in the Pacific.\n\nQuiboloy, clad in a pristine white suit, raised his hands to the heavens, his eyes blazing with fervor as he addressed the faithful. The air was thick with anticipation, the crowd hanging on his every word as he delivered a message that would echo across the Philippines and beyond.\n\n“THE FATHER HAS SPOKEN! BABYLON, THE GREAT HARLOT, HAS FALLEN!” Quiboloy’s voice boomed, his words dripping with righteous indignation. “They waged war against the Appointed Son, and now, they are no more! The armies of darkness have devoured themselves! Look upon the ruins of the so-called Land of the Free, and know this: NO ONE CHALLENGES THE WILL OF THE FATHER!”\n\nThe crowd erupted in fervent cheers, some falling to their knees in prayer, others raising their hands in worship. Quiboloy’s gaze swept over them, his expression a mix of triumph and solemnity. He had long claimed that the United States, with its secular laws and global arrogance, had targeted him unjustly—pointing to the 2021 FBI charges against him for alleged human trafficking and fraud as proof of their "persecution." Now, with America’s collapse, he saw divine vindication.\n\n“They thought they could silence the voice of the Father’s chosen!” he continued, his voice rising to a crescendo. “They mocked the Kingdom, they hunted the Appointed Son, but the Father’s judgment is swift and unyielding! The warmongers, the corrupt, the godless—they have reaped what they sowed! Their cities burn, their leaders flee, and their empire lies in ashes. This is the price of defying the Almighty!”\n\nQuiboloy paused, letting the weight of his words settle over the crowd. Behind him, a massive screen displayed images of the chaos in America—Chicago’s skyline shrouded in smoke, Boston’s streets overrun by militias, and the Golden Gate Bridge marred by the scars of battle. The crowd gasped, some weeping at the sight of the fallen nation that had once been a beacon for so many Filipinos. \n\n“And now, my children,” Quiboloy said, his tone softening but still carrying an edge of authority, “the world shifts beneath our feet. The dragon of the East rises, and the sun of the North seeks to shine in the darkness. But fear not! The Kingdom of Jesus Christ will stand as a light in these end times. The Father has prepared us for this moment. While nations crumble and empires fall, we will rise—unshaken, unbowed, for we carry the will of the Father!”\n\nAs the crowd roared in approval, Quiboloy raised a hand, silencing them. His eyes gleamed with a prophetic intensity as he delivered his final warning. “Let this be a lesson to all who remain: the Father’s will cannot be denied. Those who stand against His Appointed Son will face the same fate as Babylon. The time of judgment is upon us, and the Kingdom will prevail!”"
 phi_2acw.2.a: "A New Dawn for the Kingdom Amidst a Fractured World"
 phi_2acw.3.t: "Rings of Revolution"
 phi_2acw.3.d: "University of San Carlos, Main Campus — Cebu City\n\n\nThe ECQ was supposed to mean silence. But that morning, silence died.\nA dormer jolted awake to the echo of screaming voices and rhythmic chants reverberating up from P. del Rosario Street. He rubbed his eyes and opened the louvered window. \nFrom his balcony, he saw them—hundreds, maybe thousands. A swelling tide of red shirts, green bandanas, and improvised flags. Some bore the sun-star flag. Others waved faded Bayanihan-era posters. A few kids were even holding up Duterte memorabilia like sacred relics.\nThey were chanting a blend of old slogans and new obscenities, many pointed at the stars and stripes.\n\n"Down with America!"\n"Taguangkan sa impyerno ang CIA!"\n"Kalayaan hindi kadena!"\n\n\nThen the door burst open.\n"Dude, hide your stuff!" his dorm mate gasped, drenched in sweat and fear.\n"Take that hoodie off — the one with the stars-and-stripes. Baka mabugbog-sarado ka ng mga bata sa labas!"\nThe student blinked.\n"What’s going on—?"\n"Saw some criminology students from UC. Mga naka-skull mask — parang Call of Duty cosplayers. They trashed a surplus store full of Americana. They’re... they're not playing around, bro."\n"Nagwala sila sa Pasil. Someone got dragged for wearing Nike.""
