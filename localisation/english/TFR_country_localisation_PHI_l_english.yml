 ##2ACW shitshow
 phi_2acw.1.t: "The Foul-Mouthed Address"
 phi_2acw.1.d: "“Putang inang ‘yan [that motherfu**er], this is how America is dying from within”, Duterte said on his speech, ranting about how he snubbed the foremost former colonizer and close ally, during his time in the high castle while on TV.\n“THE UNITED STATES IS ALREADY IN DECLINE FOR YEARS AND THAT’S HOW I WITNESS THE PHENOMENON WHEN WE DECIDE TO BECOME NEUTRAL BY ENDING VFA BUT UNFORTUNATELY, IT IS APPARENT THAT SOME MY KABABAYANS [FELLOW CITIZENS] HAVE WITNESSED THE DOWNFALL,” the Philippine Punisher have lamented on his fellow during the public ceremony, spewing out first his foul-mouthed words but then addressing the situation about America.\n\n“Our ally was already divided and there’s no way to save America. I am feeling sorry for most Filipinos who lived in America whose lives are already trapped by the war,” he delivered his another lamenting speech when he described the fraught situation among the Filipino-Americans.\n“God has punished and cursed some warmongers but they admonished others. There’s a real judgement already happening today when someone who has already gone through deep division has reached its point of no return”, another speech brought from his mouth by the controversial president when he describes exactly about recent Chinese moves on the disputed South China Sea/West Philippine Sea in the early weeks of Second Civil War.\n\nThe once erstwhile ally in the Pacific stands alone amidst the reports of rival rebel groups, extremists, law enforcement officers, gang members, and soldiers begin fighting on what remains of the desecrated Continental United States with recent fighting in Chicago or APLA’s making moves near San Francisco or Patriot Front pushing for “liberation” of Boston.\nONLY TIME WILL TELL WHEN AMERICA IS GONE, someone in Tokyo will fill up the vacuum left as Beijing is emboldened, ready to eye on the rebellious island of Taiwan in hopes to use military force on enforcing reunification nor politicians in Taipei or Canberra could have plan to stop the reunification dream from becoming reality."
 phi_2acw.1.a: "Caught in limbo between Tokyo and Beijing"
 phi_2acw.2.t: "The Appointed Son’s Proclamation"
 phi_2acw.2.d: "In the shadow of a crumbling world, Pastor Apollo Quiboloy, the self-proclaimed Appointed Son of God, stood before a sea of followers in Davao City, his voice thundering through the speakers of the Kingdom of Jesus Christ’s Prayer Mountain. It was mere weeks after President Rodrigo Duterte’s scathing address, and the news of America’s descent into chaos had spread like wildfire. The once-mighty nation now lay in ruins—its cities burning, its people divided, its global influence shattered. Reports of the "Second Civil War" had escalated, with San Francisco reduced to a battleground between the APLA and Patriot Front militias, and Washington, D.C., a ghost town after a devastating rebel siege. China’s shadow loomed larger over Taiwan, while Tokyo scrambled to assert itself in the Pacific.\n\nQuiboloy, clad in a pristine white suit, raised his hands to the heavens, his eyes blazing with fervor as he addressed the faithful. The air was thick with anticipation, the crowd hanging on his every word as he delivered a message that would echo across the Philippines and beyond.\n\n“THE FATHER HAS SPOKEN! BABYLON, THE GREAT HARLOT, HAS FALLEN!” Quiboloy’s voice boomed, his words dripping with righteous indignation. “They waged war against the Appointed Son, and now, they are no more! The armies of darkness have devoured themselves! Look upon the ruins of the so-called Land of the Free, and know this: NO ONE CHALLENGES THE WILL OF THE FATHER!”\n\nThe crowd erupted in fervent cheers, some falling to their knees in prayer, others raising their hands in worship. Quiboloy’s gaze swept over them, his expression a mix of triumph and solemnity. He had long claimed that the United States, with its secular laws and global arrogance, had targeted him unjustly—pointing to the 2021 FBI charges against him for alleged human trafficking and fraud as proof of their "persecution." Now, with America’s collapse, he saw divine vindication.\n\n“They thought they could silence the voice of the Father’s chosen!” he continued, his voice rising to a crescendo. “They mocked the Kingdom, they hunted the Appointed Son, but the Father’s judgment is swift and unyielding! The warmongers, the corrupt, the godless—they have reaped what they sowed! Their cities burn, their leaders flee, and their empire lies in ashes. This is the price of defying the Almighty!”\n\nQuiboloy paused, letting the weight of his words settle over the crowd. Behind him, a massive screen displayed images of the chaos in America—Chicago’s skyline shrouded in smoke, Boston’s streets overrun by militias, and the Golden Gate Bridge marred by the scars of battle. The crowd gasped, some weeping at the sight of the fallen nation that had once been a beacon for so many Filipinos. \n\n“And now, my children,” Quiboloy said, his tone softening but still carrying an edge of authority, “the world shifts beneath our feet. The dragon of the East rises, and the sun of the North seeks to shine in the darkness. But fear not! The Kingdom of Jesus Christ will stand as a light in these end times. The Father has prepared us for this moment. While nations crumble and empires fall, we will rise—unshaken, unbowed, for we carry the will of the Father!”\n\nAs the crowd roared in approval, Quiboloy raised a hand, silencing them. His eyes gleamed with a prophetic intensity as he delivered his final warning. “Let this be a lesson to all who remain: the Father’s will cannot be denied. Those who stand against His Appointed Son will face the same fate as Babylon. The time of judgment is upon us, and the Kingdom will prevail!”"
 phi_2acw.2.a: "A New Dawn for the Kingdom Amidst a Fractured World"
 phi_2acw.3.t: "Rings of Revolution"
 phi_2acw.3.d: "University of San Carlos, Main Campus — Cebu City\n\n\nThe ECQ was supposed to mean silence. But that morning, silence died.\nA dormer jolted awake to the echo of screaming voices and rhythmic chants reverberating up from P. del Rosario Street. He rubbed his eyes and opened the louvered window. \nFrom his balcony, he saw them—hundreds, maybe thousands. A swelling tide of red shirts, green bandanas, and improvised flags. Some bore the sun-star flag. Others waved faded Bayanihan-era posters. A few kids were even holding up Duterte memorabilia like sacred relics.\nThey were chanting a blend of old slogans and new obscenities, many pointed at the stars and stripes.\n\n"Down with America!"\n"Taguangkan sa impyerno ang CIA!"\n"Kalayaan hindi kadena!"\n\n\nThen the door burst open.\n"Dude, hide your stuff!" his dorm mate gasped, drenched in sweat and fear.\n"Take that hoodie off — the one with the stars-and-stripes. Baka mabugbog-sarado ka ng mga bata sa labas!"\nThe student blinked.\n"What’s going on—?"\n"Saw some criminology students from UC. Mga naka-skull mask — parang Call of Duty cosplayers. They trashed a surplus store full of Americana. They’re... they're not playing around, bro."\n"Nagwala sila sa Pasil. Someone got dragged for wearing Nike.""
 phi_2acw.3.a: " "They're calling it the New Philippine Awakening.""
 phi_2acw.4.t: "Mistaken Identity"
 phi_2acw.4.d: " "I’m not American! I’m not a Yankee!" the foreigner cried, stumbling backward, arms raised in desperation.\nThe mob didn’t care — he looked white, he wore Nike, and he didn’t belong. A few teens closed in with scrap metal rods and skateboard decks, faces hidden behind Siege-inspired skull masks. One shouted:\n\n"Pauli sa Amerika, pesti! Huwag kang magkalat dito!"\n\n\nThen came the lifeline.\nHis fiancée, a local teacher, burst through the circle screaming, "Tama na! STOP! HINDI YAN KANO!"\nShe grabbed his wallet with trembling hands, pulling out a blue passport and ID card. \n"He’s Swedish! Tingnan niyo, basahin niyo, KINGDOM OF SWEDEN, hindi UNITED STATES OF AMERICA!"\nA pause. Confused murmurs. Someone grabbed the ID and squinted. Another asked, “Sweden? Anong bansa yan?” One teen hissed, “Europe. Hindi yan Kano.”\nSomeone in the back muttered, “Bitawan niyo na. Sayang oras natin.”\nJust like that, the fire dimmed. The mob slinked away, already hungry for a new target. The couple sat on the pavement, shaking.\nThe girl clutched his hand, whispering, “You were lucky.”\n\nHe looked at the cracked iPhone on the road, the busted storefront nearby, the Philippine flag waving from a jeep’s roof."
 phi_2acw.4.a: "He wasn’t sure anyone was lucky anymore." 
 phi_2acw.5.t: "The Hot Wheels Massacre"
 phi_2acw.5.d: "The boy — maybe seven — hadn’t gone outside in weeks. His older brother’s Hot Wheels collection was always off-limits. Chrome-plated Chevys. Plastic Lamborghinis. A tiny Tokyo police cruiser. Prized, arranged in rows under glass.\nBut this week, the living room TV wouldn’t shut up. Duterte cussed out reporters during his emergency address, again. TikTok played on loop on his mom’s phone nearby — grainy vertical clips of influencers screaming “WE DON’T NEED AMERIKKA,” over flashing edits of rotting SPAM cans and riot footage from somewhere far.\n\nSomething coiled in his chest.\nThe boy stood up, walked to the case, and flipped it off the table. He screamed as the cars scattered.\nThen he stomped. One by one. Grinding each one into the floor. Even the little Tokyo cruiser. Especially that one.\nHis older brother would find him five minutes later, fists clenched, tears in his eyes, saying: “They’re American. I don’t want them in our house anymore.”\n\nThe glass cabinet lay in ruins.\n\nWheels scattered across the linoleum. Crushed bits of plastic glinted like teeth. The boy was panting, barefoot, rage still twitching in his fingers. He hadn’t spoken in minutes. His brother stood in the hallway, frozen.\n\nAnd then: "HALA, patayin niyo nga ba ang TV!"\nThe mother stormed in from the kitchen, dish towel still slung over her shoulder, her eyes darting between the television still playing "THEY FEED YOU POISON FROM AMERIKKA!" and the boy, now trembling and silent.\n"Give me your phone," she barked.\nNo answer.\n"Totoy, I said… GIVE ME YOUR GODDAMN PHONE!"\n\n"Kaka-TikTok mo na yan! Look what you're turning into!"\n\nThe boy just sniffled, shoulders stiff. The propaganda loop kept playing — flag burning, riot footage, talking heads screaming at shadows.\nShe grabbed the phone from his hands, swiped open his TikTok feed. Every other video was shouting. American logos slashed with red. She stood there a moment, horrified."
 phi_2acw.5.a: "This wasn’t patriotism. It was programming."
 phi_2acw.6.t: "Balikbayan Welcome Committee"
 phi_2acw.6.d: "The arrivals hall of NAIA hummed with the usual chaos — suitcases rattling, porters hollering, relatives waving signs with nicknames scrawled in marker. But amidst the usual airport clamor lurked the DY boys, ever eager to pounce.\nA fresh batch of balikbayans had just arrived—Fil-Am returnees, mostly 2nd-generation kids and their families, now refugees of the Second American Civil War. They had fled the bloodstained streets of Los Angeles, the burning ruins of Chicago, the fractured remnants of a country that once prided itself as the land of the free.\nBut if they had hoped for sympathy from their ancestral homeland, they would find none here.\n"Welcome home, yankee boy!" one DY goon sneered at a weary-looking teen from the Pacific Northwest, his backpack still adorned with a faded "Bernie 2016" sticker.\nAnother leaned in close to a young woman gripping her mother’s arm. "How’s America working out for you? Didn’t think you’d be back here, huh?"\nA third, wearing an old Duterte 2016 cap, smirked at a father clutching a passport that now meant nothing. "Admit it, ‘pre—your American Dream is dead. The US was never your home."\n\nSome of the Fil-Am refugees bristled, but most just stared ahead, too tired, too broken to care. They had escaped civil war, ethnic violence, and economic collapse—only to land in a country where they were seen as a joke.\n\nOne Fil-Am, a young man who had seen too much too soon, finally muttered under his breath.\n"And yet, back in 2018, you called Duterte a genius and told liberals to leave for the US if they didn’t like it here. Well, guess what? Some of us did. And now we’re back."\nFor a moment, the DY boys fell silent. The contradiction lingered in the air, a bitter truth they refused to swallow. But their laughter soon resumed—louder, harsher, desperate.\n"At least we knew where we stood, unlike you Americanized bastards!"\nThe Fil-Am refugees said nothing. They simply moved on, dragging their luggage forward into a nation they barely knew, unsure if they had left one warzone just to enter another."
 phi_2acw.6.a: "Smile, nod, and move on."
 phi_2acw.6.b: "Fire back. Hard."
 phi_2acw.6.c: "Forget it. This country is broken anyway."
 phi_2acw.7.t: "The Guam Fever Breaks"
 phi_2acw.7.d: "It was supposed to be just another quiet evening at Ninoy Aquino International Airport. The usual mix of OFWs, balikbayans, and backpackers crowded the terminals, dragging luggage through immigration and lining up at Jollibee for one last Chickenjoy before their flight.\nThen, out of nowhere, they started chanting.\n\n“Dalhin niyo kami sa Guahan!”\nThe first few shouts seemed like an odd joke, maybe some college kids messing around. But then more voices joined in, growing into a full-blown chant that echoed across the terminal.\n“Ibalik ang Guahan!”\n“Send us to Guahan!”\n\nThe AFP officers off-duty, in civilian clothes, stopped mid-conversation, their expressions shifting from confusion to disbelief.\nOne officer—a major who had served two tours in Marawi—turned to his colleague, a captain sipping his overpriced coffee.\n“Putangina, anong nangyayari?”\n\nThe captain, ex-Special Forces, simply shook his head, watching the growing frenzy.\nIn front of them, a group of young men in black bomber jackets with Duterte Youth patches were now raising their fists, their eyes burning with fanaticism. Some wore ROTC uniforms, others fitted camouflage pants they probably bought from Cartimar.\n\nOne of the officers pulled out his phone and scrolled through Facebook.\n“May rally ba na hindi ko alam?”\n\nThen he saw it. A viral post:\n“THE PRESIDENT SAID IT HIMSELF! THE AMERICANS TOOK GUAM FROM US! IT’S TIME TO TAKE IT BACK!”\nThe comments were an absolute circus.\n\n“SEND US TO GUAM, PRESIDENT DUTERTE!”\n\n“WHY FIGHT FOR AMERICA WHEN WE CAN FIGHT FOR OUR OWN!”\n\n“IBALIK ANG INA NG GUAM, MOTHER PHILIPPINES!”\n\n“KILL ALL YANKEES! KICK THEM OUT OF THE PACIFIC!”\n\nOne particularly unhinged reply:\n“God’s will is clear. Duterte will lead us to reclaim the lost lands. Death to all who stand in the way.”\n\nThe major felt an actual headache forming.\n\n“Bakit para silang mga kulto?”\n\nThe chanting grew louder. Some of the young men climbed onto benches, waving makeshift banners. Someone had printed a photoshopped image of Duterte standing in front of a Philippine flag planted on Guam’s beaches.\n\nAirport security finally stepped in, trying to de-escalate the situation.\n\nA security guard approached one of the louder ones\n“Boss, bawal ‘yan dito.”\n\nThe young man—probably no older than 19—turned and glared at him like he had just insulted his mother\n“BAKIT, KAKAMPI KA BA NG MGA AMERIKANO?!”\n\nAnother fanatic yelled\n“TRAHEDOR! NAGTRATRABAHO PARA SA YANKEE!”\n\nThe security guard backed off, eyes wide.\n\nBy now, multiple AFP officers had pulled out their phones. Not to record, but to call someone—anyone—who could explain what the hell was going on.\nInside the terminal, normal passengers stared in bewilderment. A few foreigners whispered among themselves, trying to figure out if this was some kind of bizarre nationalist protest or a delayed flash mob.\n\nOne AFP lieutenant sighed, rubbing his temples\n“Tangina, magkakagulo na naman.”\n\nHe had seen similar fanaticism before—but never on this scale. This wasn’t just online disinformation anymore. This was real. Passengers gawk; foreigners whisper about flash mobs.\n\nThe officers dial frantically—someone’s got to explain this to HQ.\n\nAnd somewhere, inside the military high command, someone was going to have to explain to their superiors why there was now a spontaneous movement of young fanatics demanding war over Guam. Guam’s a naval fortress, a pipe dream, but these kids don’t care. Cardema’s shadow looms unseen, stoking the blaze. \n\nMadness grips NAIA—do we let it burn?"
 phi_2acw.7.a: "Let the fire spread. It’s raw power." 
 phi_2acw.7.b: "Crush it fast. This is insanity."
 phi_2acw.7.c: "Channel it. They want a fight, give them drills."
