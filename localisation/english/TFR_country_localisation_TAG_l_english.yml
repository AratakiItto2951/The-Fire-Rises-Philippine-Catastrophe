 nra.10.t: "Foreign Policy Alignment"
 nra.10.d: "While we nominally, and normally, adopt an independent foreign policy that best benefits us, we Filipinos, being a relatively small nation in the Asiatic continental shelf, should tread the delicate balance between the massive giants in our neighborhood.\n\nThe £GFX_TAG_sinophile_texticon Sinophiles, represented by the majority of the KDP and the KBL, as well as the Duterte Youth, acknowledges China’s undisputed primacy as the prime hegemon of Asia, in which a modern neo-tributary system focusing on Chinese exceptionalism and cultural assimilation as a central political strategy that requires us to play the part. \n\nWhile the Sinophiles modernized their doctrine to geopolitical realities of Russia and China being the main challengers of the liberal order, the £GFX_TAG_japanophile_texticon Japanophiles, on the other hand, represented by the more conservative halves of the KDP, KBL, retired military men, and the younger, more radical groups like the PNF and KA, tend to be more rigid and traditionalist, still wearing Cold War lenses of anti-communism, seeing modern China as an “unfit” hegemon tainted by Bolshevism.\nMake sure to maintain the delicate equilibrium at all costs; if the Sinophiles get too much influence in foreign affairs, elements of the officer corps and the Neo-Nazi groups would rise up in mutiny; if the Japanophiles do, fearing the influence of the Neo-Nazi groups, the Nationalist People’s Coalition would revolt."
 nra.10.a: "Copy that."