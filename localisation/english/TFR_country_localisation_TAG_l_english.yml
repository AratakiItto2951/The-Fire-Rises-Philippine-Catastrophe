 nra.1.t: "A quick briefing"
 nra.1.d: "The movement traces its roots to Ronald Cardema and the £GFX_TAG_DYouth_texticon Duterte Youth party-list, originally built around nationalist youth mobilization and the revival of mandatory ROTC, Citizenship Advancement Training, and scouting programs. What began as campus activism evolved into something broader—and harder.\nCardema’s network soon intersected with older nationalist forces.\nThe £GFX_TAG_KDP_texticon Katipunan ng Demokratikong Pilipino emerged from the Citizen National Guard, an ultranationalist, anti-communist, and anti-Islamist advocacy group pushing for a 'Philippine Renaissance'- a sovereign, culturally unified state built on discipline and national rebirth.\nAlongside them stands the £GFX_TAG_KBL_texticon Kilusang Bagong Lipunan, founded by Ferdinand Marcos Sr. as the political vehicle of his twenty-year rule. Though the Marcos family has since repositioned itself within mainstream politics, KBL loyalists remain ideologically committed to authoritarian order and centralized power.\nMore radical still is the £GFX_TAG_PNF_texticon Philippine National Front. Born from underground metal circles in the 2000s and organized by Raymundo Ortega and Mark Dante Almazan, the PNF fused European Fascist and National Socialist doctrine with Filipino nationalism. After organizing online for years, they appeared publicly during the 2012 anti-China protests and later staged a “March of Independence” in 2014.\nTheir former youth wing, the £GFX_TAG_KA_texticon Kabataang Amangbayan, split in 2021 after internal disputes. Studying American white nationalist movements such as Patriot Front and Atomwaffen Division, they adopted tighter organization, cultivated discreet ties within the PMA, and expanded quietly.\nFinally, the £GFX_TAG_NPC_texticon Nationalist People’s Coalition—founded in 1992—anchors the coalition within institutional politics. While others rally in the streets, NPC-aligned officials dominate local governments, essentially running the boring, yet important job of statecraft at base level.\nTaken together, they form a layered machine: youth mobilizers, ideological hardliners, street radicals, and political operators.\nAgitate one part—and the rest may move with it."
 nra.1.a: "Save the Nation!"
 
