 nra.1.t: "A quick briefing"
 nra.1.d: "To start with a quick history lesson, the movement grew out of Ronald Cardema, a firebrand enthusiast with links to American white supremacists, through his £GFX_TAG_DYouth_texticon Duterte Youth party-list, originally aiming for an advocacy to group has expressed support for the revival of mandatory Reserve Officers' Training Corps program for college students as well as support for Citizenship Advancement Training for high school students and scouting for elementary students. \n\nAmong those who joined with Cardema are the following: \n\nThe £GFX_TAG_KDP_texticon Katipunan ng Demokratikong Pilipino, an ultranationalist party priding itself as a party of principle in a country whose politics run on personality cults, that grew out of the Citizen National Guard, a nationalist, anti-communist and anti-Islamist political advocacy group to catalyze a Philippine Renaissance; a sovereign nation of one people committed to the upliftment of the quality of life of each and every Filipino.\n\n£GFX_TAG_KBL_texticon The Kilusang Bagong Lipunan, the party the late former president Ferdinand Marcos Sr. himself set up as an umbrella coalition of parties and was his political vehicle during his 20-year regime, later reorganized into its current form as a political party in 1986. Similar to the KDP, they also pride themselves as a party steadfastly loyal to the vision of the late Marcos Sr. and his authoritarian ideology, though the Marcos family already moved on and already built new siege machines as a traditional political dynasty.\n\nNow, onto the £GFX_TAG_PNF_texticon Philippine National Front. Growing out of the edgiest corners of the Filipino underground metal scene in the 2000s, these groups coalesced together under the direction of Raymundo Ortega and Mark Dante Almazan, mostly based in Luzon, to promote the ideology of Fascism and National Socialism to the Filipino people and to fuse the Fascist thought with the culture and socio-political situation of the Filipino race. Their first physical action outside of Facebook organizing was joining the rallies against the Chinese in 2012 following the Bajo de Masinloc incident and had even organized a March of Independence on 2014 at Mendiola Peace Arch.\nThe £GFX_TAG_KA_texticon Kabataang Amangbayan (Youth of the Fatherland) originally started out as the youth wing of the PNF, until internal infighting from accusations of incompetence forced them to declare independence in 2021. Learning lessons from the successes of American white nationalist groups like the Patriot Front, The Base, and the Atomwaffen Division, coupled with contacts within the Philippine Military Academy and important people in government, they slowly, steadily, grew in silence.\n\nFinally, we have the £GFX_TAG_NPC_texticon Nationalist People's Coalition, a conservative political party which was founded in 1992, who constantly maintained a presence in both houses of Congress. But their real power, like the KBL, is their dominance of local governments. In essence they run the basic machinery of state while the Tuguegarao Congress can steer the movement’s direction. And this, is what makes them dangerous when angered, and we are better off to not annoy them."
 nra.1.a: "Save the Nation!"
 
